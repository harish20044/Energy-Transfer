[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "energy-transfer-backend"
version = "0.1.0"
description = "Agentic AI-based peer-to-peer energy trading in microgrids"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Harish P" }]
# Lower bound only. Docker and CI both pin 3.12 — that is where reproducibility
# is enforced — but a contributor should be able to run the suite on whatever
# modern Python they already have rather than installing a second interpreter.
requires-python = ">=3.12"

# Base dependencies stay deliberately small: the API skeleton and nothing else.
# Heavy scientific and agent libraries live in the extras below and are pulled
# in only by the phase that needs them, so CI stays fast and the image stays lean.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
# P1 — persistence
db = [
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis[hiredis]>=5.2",
]
# P3 — forecasting
ml = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "lightgbm>=4.5",
]
# P2 — grid safety
grid = [
    "numpy>=2.1",
    "pandapower>=2.14",
]
# P4 — agents and LLM providers
agents = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    "groq>=0.15",
    "httpx>=0.28",
]
# Auth (P5)
auth = [
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# -----------------------------------------------------------------------------
# Ruff — linting and formatting
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # shadowed builtins
    "C4",        # comprehensions
    "T20",       # no print()
    "SIM",       # simplify
    "ARG",       # unused arguments
    "PTH",       # prefer pathlib
    "ASYNC",     # async correctness
    "S",         # bandit security
    "RUF",       # ruff-specific
    "ANN",       # missing annotations
]
ignore = [
    "ANN401",  # allow typing.Any where a signature genuinely needs it
    "S104",    # binding 0.0.0.0 is correct inside a container
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fixtures positionally, and hardcode throwaway credentials.
"tests/**/*.py" = ["S101", "ANN201", "ANN001", "ARG001", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------
# mypy — strict. The domain layer is the thesis contribution; it must typecheck.
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["pandapower.*", "lightgbm.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=app",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "unit: pure, fast, no I/O",
    "property: Hypothesis property-based invariant tests",
    "integration: requires postgres/redis",
    "e2e: full stack",
    "slow: excluded from the default run",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
]
