global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: energy-transfer

scrape_configs:
  - job_name: energy-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8000']
        labels:
          component: api

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
