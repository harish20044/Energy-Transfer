# Optional but recommended: catches in seconds what CI would otherwise catch in minutes.
#
#   pip install pre-commit && pre-commit install
#
# CI does not depend on this file — .github/workflows/ci.yml is the authority.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        exclude: ^frontend/tsconfig\.json$ # contains comments (JSONC)
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^backend/app/
        additional_dependencies: [pydantic>=2.10, pydantic-settings>=2.7, fastapi>=0.115]
        args: [--strict, --ignore-missing-imports]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.4.2
    hooks:
      - id: prettier
        files: ^frontend/
        exclude: ^frontend/(dist|coverage|node_modules)/
